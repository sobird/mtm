name: Build and Deploy MTM

on:
  push:
    branches: ['master']
    paths-ignore:
      - packages/**
  pull_request:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-mtm-${{ hashFiles('**/bun.lock') }}

      - name: Install shared Dependencies 🔧
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          cd packages/shared
          bun install --frozen-lockfile

      - name: Build shared 🔧
        run: |
          cd packages/shared
          bun run build

      - name: Install mtm Dependencies 🔧
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile

      - name: Running oxlint
        run: |
          bun run lint

      - name: Build mtm 🔧
        run: |
          SHA=${GITHUB_SHA} FLOW_ID=${GITHUB_RUN_ID} bun run build

      - name: Deploy VPS 🚀
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: dist/**
          target: ${{ secrets.TARGET }}
          strip_components: 1
