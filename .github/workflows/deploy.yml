name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Encode nginx config
        run: echo "NGINX_CONF_B64=$(base64 -w 0 deploy/nginx/mtm.conf)" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          envs: NGINX_CONF_B64
          script: |
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            cd "${{ secrets.TARGET }}"
            docker compose pull
            docker compose up -d

            mkdir -p deploy/nginx
            printf '%s' "$NGINX_CONF_B64" | base64 -d > deploy/nginx/mtm.conf

            # Sync nginx config only when it changed. `reload` is graceful and
            # keeps existing connections; a failed `nginx -t` rolls the file back
            # so a bad config never reaches the next nginx start.
            if ! cmp -s deploy/nginx/mtm.conf /etc/nginx/conf.d/mtm.conf; then
              cp /etc/nginx/conf.d/mtm.conf deploy/nginx/mtm.conf.prev 2>/dev/null || true
              sudo install -m 644 deploy/nginx/mtm.conf /etc/nginx/conf.d/mtm.conf
              if sudo nginx -t; then
                sudo systemctl reload nginx
              else
                if [ -f deploy/nginx/mtm.conf.prev ]; then
                  sudo install -m 644 deploy/nginx/mtm.conf.prev /etc/nginx/conf.d/mtm.conf
                fi
                echo "nginx config test failed; rolled back" >&2
                exit 1
              fi
            fi
