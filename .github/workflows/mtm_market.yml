name: Build and Deploy MTM_MARKET

on:
  push:
    branches: ['master']
    paths:
      - packages/mtm_market/**
  pull_request:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-mtm_market-${{ hashFiles('**/bun.lock') }}

      - name: Install shared Dependencies 🔧
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          cd packages/shared
          bun install --frozen-lockfile

      - name: Build shared 🔧
        run: |
          cd packages/shared
          bun run build

      - name: Install mtm_market Dependencies 🔧
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          cd packages/mtm_market
          bun install --frozen-lockfile

      - name: Build mtm_market 🔧
        run: |
          cd packages/mtm_market
          SHA=${GITHUB_SHA} FLOW_ID=${GITHUB_RUN_ID} bun run build

      - name: Deploy VPS 🚀
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: packages/mtm_market/dist/**
          target: '${{ secrets.TARGET }}/mtm_market'
          strip_components: 3

