# Managed by sobird/mtm. Source of truth is this file in the repo; deploys
# install it to /etc/nginx/conf.d/mtm.conf and local edits there are overwritten.
#
# TLS material comes from the shared include snippets/ssh_sobird.me.conf,
# which must exist on the server before this file is activated.

map $http_upgrade $mtm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mtm.sobird.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtm.sobird.me;

    include snippets/ssh_sobird.me.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mtm.sobird.me-access.log;
    error_log  /var/log/nginx/mtm.sobird.me-error.log;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mtm_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
