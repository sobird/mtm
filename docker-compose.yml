services:
  postgres:
    image: postgres:17-alpine
    ports: ['127.0.0.1:5432:5432']
    environment:
      POSTGRES_USER: mtm
      POSTGRES_PASSWORD: mtm
      POSTGRES_DB: postgres
    volumes:
      - mtm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mtm -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mtm-postgres:
